<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Teaching</title>

<style>
/* =========================================================
   E-TEACHING - SHADCN INSPIRED DESIGN
   Frontend only: HTML + CSS + JavaScript
   ========================================================= */

:root {
    --background: #f8fafc;
    --foreground: #0f172a;
    --card: #ffffff;
    --muted: #f1f5f9;
    --muted-foreground: #64748b;
    --border: #e2e8f0;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-foreground: #ffffff;
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --purple: #7c3aed;
    --sidebar: #ffffff;
    --sidebar-hover: #f1f5f9;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
}

[data-theme="dark"] {
    --background: #020617;
    --foreground: #f8fafc;
    --card: #0f172a;
    --muted: #1e293b;
    --muted-foreground: #94a3b8;
    --border: #334155;
    --sidebar: #0f172a;
    --sidebar-hover: #1e293b;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    background: var(--background);
    color: var(--foreground);
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

a {
    color: inherit;
    text-decoration: none;
}

/* =========================================================
   LOGIN
   ========================================================= */

.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
        radial-gradient(circle at top left, rgba(37,99,235,.15), transparent 35%),
        radial-gradient(circle at bottom right, rgba(124,58,237,.12), transparent 35%),
        var(--background);
}

.login-container {
    width: 100%;
    max-width: 440px;
}

.login-logo {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 22px;
    margin: 0 auto 18px;
}

.login-title {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 8px;
}

.login-subtitle {
    text-align: center;
    color: var(--muted-foreground);
    margin-bottom: 28px;
}

.login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(15,23,42,.08);
    padding: 28px;
}

.form-group {
    margin-bottom: 17px;
}

.form-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 7px;
}

.input,
.select,
.textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--foreground);
    padding: 10px 12px;
    outline: none;
    transition: .15s;
}

.input:focus,
.select:focus,
.textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}

.textarea {
    min-height: 110px;
    resize: vertical;
}

.login-button {
    width: 100%;
    margin-top: 6px;
}

.demo-accounts {
    margin-top: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.demo-account {
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 12px;
    background: var(--muted);
    cursor: pointer;
}

.demo-account:hover {
    border-color: var(--primary);
}

.demo-account-title {
    font-size: 13px;
    font-weight: 700;
}

.demo-account-text {
    font-size: 12px;
    color: var(--muted-foreground);
    margin-top: 4px;
}

/* =========================================================
   APP LAYOUT
   ========================================================= */

.app {
    min-height: 100vh;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 250px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    z-index: 100;
    display: flex;
    flex-direction: column;
}

.sidebar-brand {
    height: 70px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 11px;
    border-bottom: 1px solid var(--border);
}

.brand-icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
}

.brand-name {
    font-size: 17px;
    font-weight: 800;
}

.sidebar-role {
    font-size: 11px;
    color: var(--muted-foreground);
}

.sidebar-nav {
    flex: 1;
    padding: 15px 10px;
    overflow-y: auto;
}

.nav-section {
    margin-bottom: 18px;
}

.nav-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted-foreground);
    font-weight: 700;
    padding: 0 10px 7px;
}

.nav-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 11px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--foreground);
    font-size: 13px;
    text-align: left;
    margin-bottom: 2px;
}

.nav-item:hover {
    background: var(--sidebar-hover);
}

.nav-item.active {
    background: #eff6ff;
    color: var(--primary);
    font-weight: 600;
}

[data-theme="dark"] .nav-item.active {
    background: #172554;
}

.nav-icon {
    width: 18px;
    text-align: center;
}

.sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--border);
}

.user-mini {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px;
}

.avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #dbeafe;
    color: #1d4ed8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
}

.user-info {
    min-width: 0;
    flex: 1;
}

.user-name {
    font-size: 12px;
    font-weight: 700;
}

.user-role {
    font-size: 11px;
    color: var(--muted-foreground);
}

.main {
    margin-left: 250px;
    min-height: 100vh;
}

.topbar {
    height: 70px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    position: sticky;
    top: 0;
    z-index: 50;
}

.page-title {
    font-size: 20px;
    font-weight: 750;
}

.breadcrumb {
    color: var(--muted-foreground);
    font-size: 12px;
    margin-top: 2px;
}

.topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.content {
    padding: 28px;
    max-width: 1600px;
    margin: auto;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    border-radius: 8px;
    padding: 8px 13px;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: .15s;
}

.btn:hover {
    background: var(--muted);
}

.btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-hover);
}

.btn-danger {
    color: white;
    background: var(--danger);
    border-color: var(--danger);
}

.btn-success {
    color: white;
    background: var(--success);
    border-color: var(--success);
}

.btn-sm {
    padding: 6px 9px;
    font-size: 12px;
}

.btn-icon {
    width: 35px;
    height: 35px;
    padding: 0;
}

.btn-block {
    width: 100%;
}

/* =========================================================
   COMMON
   ========================================================= */

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
    margin-bottom: 22px;
}

.page-heading {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 5px;
}

.page-description {
    color: var(--muted-foreground);
    font-size: 13px;
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.grid {
    display: grid;
    gap: 16px;
}

.grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.grid-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
}

.grid-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}

.card-header {
    padding: 17px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.card-title {
    font-weight: 700;
    font-size: 14px;
}

.card-description {
    font-size: 12px;
    color: var(--muted-foreground);
    margin-top: 3px;
}

.card-body {
    padding: 18px;
}

.stat-card {
    padding: 18px;
}

.stat-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.stat-label {
    font-size: 12px;
    color: var(--muted-foreground);
    font-weight: 600;
}

.stat-icon {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: #eff6ff;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
}

.stat-value {
    font-size: 27px;
    font-weight: 800;
    margin-top: 10px;
}

.stat-change {
    font-size: 11px;
    margin-top: 5px;
    color: var(--muted-foreground);
}

.text-success {
    color: var(--success);
}

.text-warning {
    color: var(--warning);
}

.text-danger {
    color: var(--danger);
}

.text-muted {
    color: var(--muted-foreground);
}

.badge {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 10px;
    font-weight: 700;
    border: 1px solid transparent;
}

.badge-blue {
    color: #1d4ed8;
    background: #dbeafe;
}

.badge-green {
    color: #15803d;
    background: #dcfce7;
}

.badge-yellow {
    color: #a16207;
    background: #fef9c3;
}

.badge-red {
    color: #b91c1c;
    background: #fee2e2;
}

.badge-purple {
    color: #6d28d9;
    background: #ede9fe;
}

.progress {
    width: 100%;
    height: 7px;
    background: var(--muted);
    border-radius: 999px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    background: var(--primary);
    border-radius: inherit;
}

.progress-row {
    margin-bottom: 15px;
}

.progress-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 6px;
}

.table-wrapper {
    overflow-x: auto;
}

.table {
    width: 100%;
    border-collapse: collapse;
}

.table th {
    font-size: 11px;
    color: var(--muted-foreground);
    font-weight: 700;
    text-align: left;
    padding: 11px 15px;
    background: var(--muted);
    white-space: nowrap;
}

.table td {
    font-size: 12px;
    padding: 13px 15px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
}

.table tr:last-child td {
    border-bottom: none;
}

.table tr:hover td {
    background: rgba(148,163,184,.05);
}

.list-item {
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
}

.list-item:last-child {
    border-bottom: none;
}

.flex {
    display: flex;
}

.items-center {
    align-items: center;
}

.justify-between {
    justify-content: space-between;
}

.gap-8 {
    gap: 8px;
}

.gap-12 {
    gap: 12px;
}

.gap-16 {
    gap: 16px;
}

.mb-16 {
    margin-bottom: 16px;
}

.mb-20 {
    margin-bottom: 20px;
}

.mt-16 {
    margin-top: 16px;
}

/* =========================================================
   COURSE
   ========================================================= */

.course-card {
    overflow: hidden;
    cursor: pointer;
    transition: .18s;
}

.course-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(15,23,42,.1);
}

.course-cover {
    height: 105px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    padding: 18px;
    color: white;
    position: relative;
}

.course-cover.green {
    background: linear-gradient(135deg, #059669, #0d9488);
}

.course-cover.orange {
    background: linear-gradient(135deg, #ea580c, #d97706);
}

.course-cover.pink {
    background: linear-gradient(135deg, #db2777, #9333ea);
}

.course-code {
    font-size: 10px;
    opacity: .8;
}

.course-cover-title {
    font-size: 16px;
    font-weight: 800;
    margin-top: 7px;
}

.course-body {
    padding: 15px;
}

.course-description {
    color: var(--muted-foreground);
    font-size: 12px;
    line-height: 1.5;
    min-height: 36px;
}

.course-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 620px;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 13px;
    box-shadow: 0 25px 80px rgba(0,0,0,.2);
}

.modal-header {
    padding: 17px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-title {
    font-weight: 800;
}

.modal-body {
    padding: 20px;
}

.modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast-container {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.toast {
    min-width: 280px;
    max-width: 380px;
    padding: 13px 15px;
    border-radius: 9px;
    background: var(--card);
    color: var(--foreground);
    border: 1px solid var(--border);
    box-shadow: 0 12px 35px rgba(15,23,42,.15);
    font-size: 13px;
    animation: toastIn .2s ease;
}

.toast.success {
    border-left: 4px solid var(--success);
}

.toast.error {
    border-left: 4px solid var(--danger);
}

@keyframes toastIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================================================
   DETAIL / LESSON / QUIZ
   ========================================================= */

.detail-hero {
    padding: 25px;
    border-radius: 13px;
    color: white;
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    margin-bottom: 18px;
}

.detail-hero h1 {
    margin: 0 0 8px;
    font-size: 26px;
}

.detail-hero p {
    margin: 0;
    opacity: .85;
    font-size: 13px;
}

.lesson-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 9px;
    margin-bottom: 8px;
    cursor: pointer;
}

.lesson-item:hover {
    background: var(--muted);
}

.lesson-number {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
}

.lesson-item.completed .lesson-number {
    background: #dcfce7;
    color: var(--success);
}

.quiz-question {
    padding: 17px;
    border: 1px solid var(--border);
    border-radius: 9px;
    margin-bottom: 14px;
}

.quiz-question-title {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 12px;
}

.quiz-option {
    display: block;
    padding: 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
    margin-bottom: 7px;
    cursor: pointer;
    font-size: 13px;
}

.quiz-option:hover {
    background: var(--muted);
}

.quiz-option input {
    margin-right: 8px;
}

.result-circle {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 8px solid #dbeafe;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    margin: 15px auto;
}

/* =========================================================
   CALENDAR
   ========================================================= */

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
}

.calendar-head {
    padding: 10px;
    background: var(--muted);
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    border-right: 1px solid var(--border);
}

.calendar-day {
    min-height: 100px;
    padding: 8px;
    border-top: 1px solid var(--border);
    border-right: 1px solid var(--border);
    font-size: 11px;
}

.calendar-day-number {
    font-weight: 700;
    margin-bottom: 7px;
}

.calendar-event {
    background: #dbeafe;
    color: #1d4ed8;
    padding: 3px 5px;
    border-radius: 4px;
    margin-bottom: 3px;
    font-size: 9px;
}

/* =========================================================
   EMPTY
   ========================================================= */

.empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted-foreground);
}

.empty-icon {
    font-size: 35px;
    margin-bottom: 10px;
}

/* =========================================================
   MOBILE
   ========================================================= */

.mobile-menu {
    display: none;
}

@media(max-width: 1000px) {
    .sidebar {
        transform: translateX(-100%);
        transition: .2s;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .main {
        margin-left: 0;
    }

    .mobile-menu {
        display: inline-flex;
    }

    .grid-4 {
        grid-template-columns: repeat(2, 1fr);
    }

    .grid-3 {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 700px) {
    .content {
        padding: 17px;
    }

    .topbar {
        padding: 0 17px;
    }

    .grid-2,
    .grid-3,
    .grid-4 {
        grid-template-columns: 1fr;
    }

    .page-header {
        flex-direction: column;
    }

    .page-heading {
        font-size: 20px;
    }

    .calendar-day {
        min-height: 70px;
    }

    .calendar-event {
        display: none;
    }
}
</style>
</head>

<body>

<div id="root"></div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <div id="modalTitle" class="modal-title"></div>
            <button class="btn btn-icon" onclick="closeModal()">✕</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
        <div id="modalFooter" class="modal-footer"></div>
    </div>
</div>

<div id="toastContainer" class="toast-container"></div>

function getData() {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_DATA));
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    try {
        return JSON.parse(saved);
    } catch {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_DATA));
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
}

let data = getData();

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* =========================================================
   SESSION
   ========================================================= */

function loadSession() {
    const session = localStorage.getItem(SESSION_KEY);

    if (session) {
        try {
            const parsed = JSON.parse(session);
            state.role = parsed.role;
            state.user = parsed.user;
        } catch {
            localStorage.removeItem(SESSION_KEY);
        }
    }
}

function login(role, username, password) {

    if (role === "teacher" && username === "teacher" && password === "123") {
        state.role = "teacher";
        state.user = "teacher";
    }
    else if (role === "student" && username === "student" && password === "123") {
        state.role = "student";
        state.user = "student";
    }
    else {
        toast("Invalid username or password.", "error");
        return;
    }

    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify({
            role: state.role,
            user: state.user
        })
    );

    state.page = "dashboard";

    render();
    toast(
        state.role === "teacher"
            ? "Welcome Teacher!"
            : "Welcome Student!",
        "success"
    );
}

function logout() {
    localStorage.removeItem(SESSION_KEY);

    state.role = null;
    state.user = null;
    state.page = "dashboard";

    render();
}

        if (item) {

function completeLesson(id) {

    const lesson = data.lessons.find(l => l.id === id);

    if (lesson) {
        lesson.completed = true;
        saveData();
        render();
        toast("Lesson marked as completed.", "success");
    }
}

function openNextLesson(id) {

    const current = data.lessons.find(l => l.id === id);

    const lessons = data.lessons.filter(
        l => l.courseId === current.courseId
    );

    const index = lessons.findIndex(l => l.id === id);

    if (index < lessons.length - 1) {
        openLesson(lessons[index + 1].id);
    } else {
        toast("You completed all lessons in this course!", "success");
    }
}

    data.submissions.push({
        id: Date.now(),
        assignmentId: state.selectedAssignmentId,
        studentId: 1,
        submittedAt: new Date().toISOString().slice(0,10),
        score: null,
        status: "Submitted"

    data.notifications.unshift({
        id: Date.now() + 1,
        role: "teacher",
        title: "New Submission",
        text: "Student submitted an assignment.",
        read: false
    });

    saveData();

    render();

    toast("Assignment submitted successfully.", "success");
}

function submitQuiz() {

    const quiz = data.quizzes.find(
        q => q.id === state.selectedQuizId
    );

    let correct = 0;

    quiz.questions.forEach(q => {

        const selected = document.querySelector(
            `input[name="question_${q.id}"]:checked`
        );

        if (
            selected &&
            Number(selected.value) === q.answer
        ) {
            correct++;
        }
    });

    const score = Math.round(
        (correct / quiz.questions.length) * 100
    );

    data.quizResults.push({
        id: Date.now(),
        quizId: quiz.id,
        studentId: 1,
        score,
        date: new Date().toISOString().slice(0,10)
    });

    saveData();

    state.page = "quiz-result";

    render();

    toast("Quiz submitted.", "success");
}

function generateCalendarDays() {

    let html = "";

    for (let i = 1; i <= 31; i++) {

        const date = `2026-10-${String(i).padStart(2,"0")}`;

        const events = data.events.filter(
            e => e.date === date
        );

        html += `
            <div class="calendar-day">

                <div class="calendar-day-number">
                    ${i}
                </div>

                ${events.map(e => `
                    <div
                        class="calendar-event"
                        onclick="toast('${escapeHtml(e.title)}')"
                    >
                        ${escapeHtml(e.title)}
                    </div>
                `).join("")}

            </div>
        `;
    }

    return html;
}

function settingToggle(title, description, key) {

    return `
        <label
            class="flex items-center justify-between"
            style="padding:11px 0;cursor:pointer"
        >

            <div>
                <strong style="font-size:13px">
                    ${title}
                </strong>

                <div class="text-muted" style="font-size:11px">
                    ${description}
                </div>
            </div>

            <input
                type="checkbox"
                ${
                    data.settings[key]
                    ? "checked"
                    : ""
                }
                onchange="changeSetting('${key}',this.checked)"
            >

        </label>
    `;
}

function changeSetting(key,value) {

    data.settings[key] = value;

    saveData();

    toast("Setting updated.", "success");
}

function toggleTheme(forceValue) {

    if (typeof forceValue === "boolean") {
        data.settings.darkMode = forceValue;
    } else {
        data.settings.darkMode = !data.settings.darkMode;
    }

    saveData();

    applyTheme();

    if (state.role) {
        render();
    }
}

function applyTheme() {

    document.documentElement.dataset.theme =
        data.settings.darkMode
        ? "dark"
        : "light";
}

function resetDemoData() {

    if (!confirm("Reset all demo data?")) {
        return;
    }

    localStorage.removeItem(STORAGE_KEY);

    data = getData();

    applyTheme();

    render();

    toast("Demo data has been reset.", "success");
}

function createCourse() {

    const code = document.getElementById("courseCode").value.trim();
    const title = document.getElementById("courseTitle").value.trim();

    const description = document
        .getElementById("courseDescription")

    if (!code || !title) {

    data.courses.push({
        id: Date.now(),
        code,
        title,

        progress: 0,
        color: "blue"

    saveData();
    closeModal();
    render();

    openModal(

                onclick="updateCourse(${id})"
            >
                Save Changes

function updateCourse(id) {

    const course = data.courses.find(c => c.id === id);

    course.code = document.getElementById("editCourseCode").value.trim();
    course.title = document.getElementById("editCourseTitle").value.trim();
    course.description =
        document.getElementById("editCourseDescription").value.trim();

    saveData();

    closeModal();
    render();

    toast("Course updated.", "success");
}

function deleteCourse(id) {

    if (!confirm("Delete this course?")) {
        return;
    }

    data.courses = data.courses.filter(c => c.id !== id);
    data.lessons = data.lessons.filter(l => l.courseId !== id);
    data.assignments = data.assignments.filter(a => a.courseId !== id);
    data.quizzes = data.quizzes.filter(q => q.courseId !== id);

    saveData();

    navigate("courses");

    toast("Course deleted.", "success");
}

            </div>

        `

                Cancel
            </button>

            <button
                class="btn btn-primary"
                onclick="saveGrade(${id})"
            >
                Save Grade
            </button>
        `
    );
}

function saveGrade(id) {

    const submission = data.submissions.find(
        s => s.id === id
    );

    const score = Number(
        document.getElementById("gradeScore").value
    );

    if (isNaN(score)) {
        toast("Enter a valid score.", "error");
        return;
    }

    submission.score = score;
    submission.status = "Graded";

    saveData();

    closeModal();
    render();

    toast("Grade saved successfully.", "success");

function saveQuizBuilder(id) {

function addQuestionToQuiz(id) {

    closeModal();

    openModal(
        "Add Question",
        `

                <label class="form-label">
                    Question

                <input
                    id="newQuestion"

            </div>

            <div class="grid grid-2">

                <div class="form-group">
                    <label class="form-label">Option B</label>
                    <input id="optionB" class="input">
                </div>

                <div class="form-group">
                    <label class="form-label">Option C</label>
                    <input id="optionC" class="input">
                </div>

                <div class="form-group">
                    <label class="form-label">Option D</label>
                    <input id="optionD" class="input">
                </div>

            </div>

            <div class="form-group">

                <label class="form-label">
                    Correct Answer
                </label>

                <select id="correctAnswer" class="select">
                    <option value="0">A</option>
                    <option value="1">B</option>
                    <option value="2">C</option>
                    <option value="3">D</option>
                </select>

            </div>
        `,
        `
            <button class="btn" onclick="closeModal()">

            <button
                class="btn btn-primary"

                Add Question
            </button>

    );
}

function saveNewQuestion(id) {

    const question = document
        .getElementById("newQuestion")
        .value
        .trim();

    const options = [
        document.getElementById("optionA").value.trim(),
        document.getElementById("optionB").value.trim(),
        document.getElementById("optionC").value.trim(),
        document.getElementById("optionD").value.trim()
    ];

    const answer = Number(
        document.getElementById("correctAnswer").value
    );

    if (!question || options.some(x => !x)) {
        toast("Complete all question fields.", "error");
        return;
    }

    const quiz = data.quizzes.find(q => q.id === id);

    quiz.questions.push({
        id: Date.now(),
        question,
        options,
        answer
    });

    saveData();

    closeModal();

    openQuizBuilder(id);

    toast("Question added.", "success");
}

function markNotificationRead(id) {

        x => x.id === id
    );

        n.read = true;
        saveData();
        render();

        .forEach(n => n.read = true);

/* =========================================================
   MODAL SYSTEM
   ========================================================= */

function openModal(title, body, footer = "") {

    document.getElementById("modalTitle").innerHTML = title;
    document.getElementById("modalBody").innerHTML = body;
    document.getElementById("modalFooter").innerHTML = footer;

    document
        .getElementById("modalOverlay")
        .classList.add("show");
}

function closeModal() {

    document
        .getElementById("modalOverlay")
        .classList.remove("show");
}

document.getElementById("modalOverlay")
    .addEventListener("click", function(e) {

        if (e.target === this) {
            closeModal();
        }

    });

/* =========================================================
   TOAST
   ========================================================= */

function toast(message, type = "success") {

    const container =
        document.getElementById("toastContainer");

    const item = document.createElement("div");

    item.className = `toast ${type}`;

    item.textContent = message;

    container.appendChild(item);

    setTimeout(() => {
        item.remove();
    }, 3000);
}

/* =========================================================
   HELPERS
   ========================================================= */

function initials(name) {

    return name
        .split(" ")
        .map(x => x[0])
        .join("")
        .substring(0,2)
        .toUpperCase();
}

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttr(value) {
    return escapeHtml(value);
}

/* =========================================================
   MAIN RENDER
   ========================================================= */

function render() {

    const root = document.getElementById("root");

    if (!state.role) {
        root.innerHTML = renderLogin();
        return;
    }

    root.innerHTML = renderApp();
}

/* =========================================================
   INIT
   ========================================================= */

loadSession();
applyTheme();
render();
